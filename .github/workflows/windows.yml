name: Windows build

# Every push to main: check, test and build the installer.
# A release (a tag like v0.2.0, or "Run workflow" with a version): the same, then sign the update
# and publish a GitHub release that installed copies of Neat pick up by themselves.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 0.2.0. Leave empty for a plain build."
        required: false
        default: ""

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.release || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: npm ci

      - name: Check UI types and formatting
        run: |
          npm run typecheck
          npm run format:check

      - name: Test the core against a fake Downloads folder
        run: cargo test -p neat-core

      - name: Prepare a signed release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # A pushed tag, or the version typed into "Run workflow".
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release) }}
        run: |
          if (-not $env:PUBKEY -or -not $env:KEY) {
            throw "Add the TAURI_UPDATER_PUBKEY and TAURI_SIGNING_PRIVATE_KEY repository secrets first. README.md, 'Updates', has the steps."
          }
          if ($env:TAG -match '^vv?(\d+\.\d+\.\d+)$') { $version = $Matches[1] } else { throw "Release versions look like 1.2.3, not $env:TAG." }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          # Merged into tauri.conf.json for this build only: the tag's version, update artifacts, and the key
          # that installed copies use to check each update.
          @{
            version = $version
            bundle  = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:PUBKEY.Trim() } }
          } | ConvertTo-Json -Depth 5 | Set-Content release.conf.json -Encoding utf8NoBOM
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (Test-Path release.conf.json) { npm run tauri build -- --config release.conf.json } else { npm run tauri build }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: neat-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-Item "target/release/bundle/nsis/*-setup.exe"
          if (@($exe).Count -ne 1) { throw "Expected one installer, found $(@($exe).Count)." }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "The build did not sign the installer." }
          # What installed copies read from releases/latest/download/latest.json.
          @{
            version   = $env:VERSION
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          # Creates the tag on this commit when "Run workflow" started the release.
          gh release create $env:RELEASE_TAG $exe.FullName $sig latest.json --target $env:GITHUB_SHA --title "Neat $env:VERSION" --generate-notes
