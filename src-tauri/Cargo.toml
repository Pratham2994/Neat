[package]
name = "neat"
version = "0.1.0"
description = "Keeps the Downloads folder organised"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "neat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
neat-core = { version = "0.1.0", path = "../core" }
notify = "8.2.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
